<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CocoGame - Official Website</title>
    <!-- 引入 Font Awesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #f9f9f9; 
            color: #333; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            justify-content: center; 
        }
        .container { 
            max-width: 600px; 
            margin: auto; 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        h1 { color: #1a1a1a; margin-bottom: 10px; }
        p { color: #666; font-size: 1.1em; margin-bottom: 30px; }
        .social-links { display: flex; flex-direction: column; gap: 15px; }
        .btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            padding: 12px 20px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-weight: bold; 
            color: white; 
            font-size: 1em; 
            transition: transform 0.2s, opacity 0.2s; 
        }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn-youtube { background-color: #FF0000; }
        .btn-facebook { background-color: #1877F2; }
        .btn-playstore { background-color: #01875F; }
        .btn i { font-size: 1.2em; }
        
        footer { margin-top: 30px; font-size: 0.85em; color: #888; }
        footer a { color: #666; text-decoration: underline; margin: 0 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CocoGame</h1>
        <p>Welcome to play Wi-Fi App.</p>
        
        <div class="social-links">
            <a href="https://www.youtube.com/@CocoGame" target="_blank" class="btn btn-youtube">
                <i class="fab fa-youtube"></i> YouTube Channel
            </a>
            <a href="https://www.facebook.com/CocoGameTW" target="_blank" class="btn btn-facebook">
                <i class="fab fa-facebook-f"></i> Facebook Page
            </a>
            <a href="https://play.google.com/store/apps/dev?id=4977565818118736514" target="_blank" class="btn btn-playstore">
                <i class="fab fa-google-play"></i> Google Play Store
            </a>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2026 CocoGame. All rights reserved.</p>
        <p>
            <a href="https://nashyuuki.github.io/privacy.html">Privacy Policy</a>
        </p>
    </footer>
</body>
</html>
